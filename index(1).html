function scream(ctx, dur, sfx) {
  const t0 = ctx.currentTime;
  const master = ctx.createGain(); master.gain.value = sfx ? 1.0 : 2.4;
  const comp = ctx.createDynamicsCompressor();
  const ws = ctx.createWaveShaper();
  const k = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; k[i] = Math.tanh(x * 4); }
  ws.curve = k;
  comp.threshold.value = -36; comp.knee.value = 0; comp.ratio.value = 20;
  comp.attack.value = 0.002; comp.release.value = 0.15;
  const clip = ctx.createWaveShaper();
  const kc = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; kc[i] = Math.tanh(x * 1.5) * 0.98; }
  clip.curve = kc;
  ws.connect(master); master.connect(comp); comp.connect(clip); clip.connect(ctx.destination);
  // distorted motor clip on top
  if (sfx) {
    const ss = ctx.createBufferSource(); ss.buffer = sfx;
    const sg = ctx.createGain(); sg.gain.value = 1.0;
    ss.connect(sg); sg.connect(master); ss.start(t0);
  }
  // low rumble under everything
  const r = ctx.createOscillator(); r.type = 'sawtooth'; r.frequency.value = 38;
  const rf = ctx.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 140;
  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0, t0); rg.gain.linearRampToValueAtTime(0.6, t0 + 0.3);
  rg.gain.setValueAtTime(0.6, t0 + dur - 0.4); rg.gain.linearRampToValueAtTime(0, t0 + dur);
    // breathy noise
  const nl = Math.floor(ctx.sampleRate * dur);
  const nb = ctx.createBuffer(1, nl, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
  // one groan: pitch falls, two formant filters shift like a vowel "aaa -> ooo"
  function groan(at, len, f0, vol) {
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, at);
    o.frequency.linearRampToValueAtTime(f0 * 1.25, at + len * 0.3);
    o.frequency.linearRampToValueAtTime(f0 * 0.6, at + len);
    const lfo = ctx.createOscillator(), ld = ctx.createGain();
    lfo.frequency.value = 5.5; ld.gain.value = f0 * 0.05;
    lfo.connect(ld); ld.connect(o.frequency);
    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 6;
    f1.frequency.setValueAtTime(750, at); f1.frequency.linearRampToValueAtTime(380, at + len);
    const f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 7;
    f2.frequency.setValueAtTime(1150, at); f2.frequency.linearRampToValueAtTime(700, at + len);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + len * 0.25);
    g.gain.linearRampToValueAtTime(vol * 0.8, at + len * 0.7); g.gain.linearRampToValueAtTime(0, at + len);
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(ws);
    const n = ctx.createBufferSource(); n.buffer = nb;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 1.5;
    const ng = ctx.createGain(); ng.gain.value = vol * 0.35;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, at); env.gain.linearRampToValueAtTime(1, at + len * 0.2); env.gain.linearRampToValueAtTime(0, at + len);
    n.connect(nf); nf.connect(ng); ng.connect(env); env.connect(ws);
    o.start(at); lfo.start(at); o.stop(at + len + 0.05); n.start(at, 0, len); 
  }
}

function drawFrame(t, dur) {
  const W = cv.width, H = cv.height, m = Math.min(W, H);
  const p = t / dur, rnd = Math.random;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.globalCompositeOperation = 'source-over';
  // background with motion ghosting
  const pulse = 0.5 + 0.5 * Math.sin(t * 8);
  const g = cx.createRadialGradient(W/2, H/2, 0, W/2, H/2, m);
  g.addColorStop(0, 'rgb(' + (60 + pulse * 50 | 0) + ',0,0)'); g.addColorStop(1, '#000');
  cx.globalAlpha = 0.5; cx.fillStyle = g; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1;
  const beat = 1 + 0.04 * Math.max(0, Math.sin(t * 13));
  const s = (0.8 + p * 1.15) * beat;
  const sh = 5 + p * 30;
  cx.translate(W/2 + (rnd()-.5)*sh, H/2 + (rnd()-.5)*sh);
  cx.rotate((rnd()-.5) * 0.06 * p + Math.sin(t * 3) * 0.03);
  const stretch = rnd() < 0.08 ? 1 + rnd() * 0.18 : 1;
  cx.scale(s * stretch, s);
  const fw = m * 0.3, fh = m * 0.42;
  // skull with glowing red eyes
  const bone = '#e6dfcb';
  cx.fillStyle = bone;
  cx.beginPath(); cx.ellipse(0, -fh * 0.08, fw, fh * 0.82, 0, 0, 7); cx.fill();
  const jaw = Math.abs(Math.sin(t * 13)) * fh * 0.14 * (0.4 + p);
  cx.beginPath(); cx.roundRect(-fw * 0.58, fh * 0.52 + jaw, fw * 1.16, fh * 0.36, fw * 0.12); cx.fill();
  cx.fillStyle = '#000';
  [-1, 1].forEach(sd => {
    cx.beginPath(); cx.ellipse(sd * fw * 0.42, -fh * 0.12, fw * 0.27, fh * 0.2, sd * 0.2, 0, 7); cx.fill();
    const eg = cx.createRadialGradient(sd * fw * 0.42, -fh * 0.12, 0, sd * fw * 0.42, -fh * 0.12, fw * 0.14);
    eg.addColorStop(0, 'rgba(255,40,20,' + (0.6 + pulse * 0.4) + ')'); eg.addColorStop(1, 'rgba(255,0,0,0)');
    cx.fillStyle = eg; cx.beginPath(); cx.arc(sd * fw * 0.42, -fh * 0.12, fw * 0.14, 0, 7); cx.fill();
    cx.fillStyle = '#000';
  });
  cx.beginPath(); cx.moveTo(0, fh * 0.12); cx.lineTo(-fw * 0.12, fh * 0.36); cx.lineTo(fw * 0.12, fh * 0.36); cx.fill();
  cx.fillStyle = '#000'; cx.fillRect(-fw * 0.5, fh * 0.55 + jaw * 0.2, fw, fh * 0.07);
  cx.fillStyle = bone;
  for (let i = 0; i < 8; i++) cx.fillRect(-fw * 0.5 + i * fw / 8 + 2, fh * 0.52 + jaw * 0.2, fw / 8 - 4, fh * 0.1 + jaw * 0.5);
  cx.strokeStyle = 'rgba(0,0,0,.55)'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(fw * 0.2, -fh * 0.85); cx.lineTo(fw * 0.1, -fh * 0.55); cx.lineTo(fw * 0.25, -fh * 0.4); cx.stroke();
  cx.setTransform(1, 0, 0, 1, 0, 0);
  // photos flash one after another (each held 0.33 s, max 3 changes per second)
  if (t >= 0) {
    if (!seq.length) {
      let last = -1;
      for (let i = 0; i < 12; i++) {
        let k; do { k = Math.floor(rnd() * IMGS.length); } while (k === last && IMGS.length > 1);
        seq.push(k); last = k;
      }
    }
    const SLOT = 0.33, si = Math.floor(t / SLOT), sq = (t % SLOT) / SLOT;
    const im = IMGS[seq[si % seq.length]];
    if (im.complete && im.naturalWidth) {
      const z = 1.05 + sq * 0.25 + 0.03 * Math.max(0, Math.sin(t * 13));
      const tall = im.naturalHeight > im.naturalWidth * 1.3;
      const cs = (tall ? H / im.naturalHeight : Math.max(W / im.naturalWidth, H * 0.6 / im.naturalHeight)) * z;
      const iw = im.naturalWidth * cs, ih = im.naturalHeight * cs;
      cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
      cx.drawImage(im, W / 2 - iw / 2 + (rnd() - .5) * sh, H / 2 - ih / 2 + (rnd() - .5) * sh, iw, ih);
    }
  }
  // chromatic aberration
  cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = 0.3;
  cx.drawImage(cv, 10 * p + 3, 0); cx.drawImage(cv, -10 * p - 3, 0);
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  // glitch slices
  for (let i = 0; i < 8; i++) {
    const y = rnd() * H, h = 6 + rnd() * 70, dx = (rnd() - .5) * 160 * p;
    cx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  // VHS tracking bar
  const by = ((t * 380) % (H + 120)) - 60;
  cx.fillStyle = 'rgba(255,255,255,.12)'; cx.fillRect(0, by, W, 40);
  cx.drawImage(cv, 0, by, W, 20, (rnd()-.5) * 40, by, W, 20);
  // film grain, dust and scratches
  cx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = 0; i < 260; i++) cx.fillRect(rnd() * W, rnd() * H, 2, 2);
  cx.fillStyle = 'rgba(255,255,255,.18)';
  if (rnd() < 0.4) cx.fillRect(rnd() * W, 0, 2, H);
  // scanlines
  cx.fillStyle = 'rgba(0,0,0,.28)';
  for (let y = 0; y < H; y += 4) cx.fillRect(0, y, W, 1);
  // creepy flickering text
  if ((t > 1.6 && t < 1.9) || (t > 2.7 && t < 3.0)) {
    cx.save(); cx.font = 'bold ' + (m * 0.12 | 0) + 'px sans-serif'; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(200,0,0,.85)';
    cx.fillText('ОН РЯДОМ', W / 2 + (rnd()-.5) * 30, H * 0.9 + (rnd()-.5) * 20);
    cx.restore();
  }
  // vignette
  const v = cx.createRadialGradient(W/2, H/2, m * 0.3, W/2, H/2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + (0.65 + p * 0.3) + ')');
  cx.fillStyle = v; cx.fillRect(0, 0, W, H);
  // two short colour inversions (well under 3 flashes per second)
  if (false) {
    cx.globalCompositeOperation = 'difference'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'source-over';
  }
}

function end() {
  seq = [];
  cv.style.display = 'none'; msg.style.display = 'flex'; running = false;
  msg.style.background = '#000';
  msg.innerHTML = '<img src="' + MEME + '" alt="" style="max-width:92vw;max-height:62vh;border-radius:8px"><div style="margin-top:14px">ебать ты лох 😘</div><small>Нажмите, чтобы повторить</small>';
  if (document.fullscreenElement) document.exitFullscreen?.();
}

msg.addEventListener('click', async () => {
  if (running) return; running = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC(); await ctx.resume();
  let sfx = null;
  try {
    const bin = atob(SFX.split(',')[1]), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const raw = u8.buffer;
    sfx = await ctx.decodeAudioData(raw);
  } catch (e) {}
  msg.style.display = 'none';
  try { document.documentElement.requestFullscreen?.(); } catch (e) {}
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = 'block';
  cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height);
  const dur = 3.2;
  setTimeout(() => {
    scream(ctx, dur, sfx);
    if (!sfx) { try { const a = new Audio(SFX); a.volume = 1; a.play(); } catch (e) {} }
    try { navigator.vibrate?.([300, 100, 300, 100, 500]); } catch (e) {}
    const st = performance.now();
    (function loop(now) {
      const t = (now - st) / 1000;
      if (t >= dur) return end();
      drawFrame(t, dur); requestAnimationFrame(loop);
    })(st);
  }, 700);
});
</script>
